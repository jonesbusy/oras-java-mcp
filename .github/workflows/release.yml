name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: sonatype-cp
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Tests run in the build workflow on main; the tag is expected to point at a green commit.
      # The Quarkus uber jar is attached with the 'runner' classifier, which jbang runs.
      - name: Deploy to Maven Central with njord
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.CENTRAL_PASSWORD }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Drevision="$RELEASE_VERSION" -Dchangelist=
          -Prelease -DskipTests
          -DaltDeploymentRepository=sonatype-cp::njord:
          -Dnjord.autoPublish=true
          -Dnjord.publisher=sonatype-cp
          -Dnjord.publisher.sonatype-cp.publishingType=AUTOMATIC
          -Dnjord.publisher.sonatype-cp.waitForStates=true
          -Dnjord.publisher.sonatype-cp.waitForStatesTimeout=PT2H
          deploy

      - name: Attach runner jar and publish the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          jar="target/oras-java-mcp-${RELEASE_TAG}-runner.jar"
          test -s "$jar"
          (cd target && sha256sum "$(basename "$jar")" > SHA256SUMS)
          draft_id=$(gh api "/repos/${GH_REPO}/releases" --jq '[.[] | select(.draft == true)][0].id // empty')
          if [[ -n "$draft_id" ]]; then
            gh api -X PATCH "/repos/${GH_REPO}/releases/${draft_id}" -f tag_name="$RELEASE_TAG" -f name="$RELEASE_TAG" -F draft=false
          elif ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$jar" target/SHA256SUMS --clobber
