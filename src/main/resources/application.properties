# Runnable with `jbang io.github.jonesbusy:oras-java-mcp:<version>:runner` or `java -jar *-runner.jar`.
quarkus.package.jar.type=uber-jar
quarkus.banner.enabled=false

# stdout belongs to the MCP protocol. The stdio extension sends console logs to stderr,
# which MCP clients show as server logs: keep them short.
quarkus.log.level=WARN
quarkus.log.category."io.github.jonesbusy".level=INFO

quarkus.mcp.server.server-info.name=oras-java-mcp
quarkus.mcp.server.server-info.title=ORAS Java MCP
quarkus.mcp.server.server-info.version=${quarkus.application.version}
quarkus.mcp.server.server-info.website-url=https://github.com/jonesbusy/oras-java-mcp
quarkus.mcp.server.server-info.instructions=Read-only access to OCI registries (container images, Helm charts, \
  ORAS artifacts, signatures, SBOMs). Use 'resolve' to pin a reference to its digest, 'inspect' to see what it contains, then 'list_referrers' for attached artifacts, \
  'get_blob' for config or text payloads, 'list_tags' to browse versions. Credentials are those of \
  docker/podman login on the host.

# One registry bean, without a host, so any fully qualified reference works.
# Authentication, registries.conf (aliases, unqualified search, insecure registries, mirrors)
# and policy.json come from the SDK defaults, like the docker/podman CLIs.
# Runtime overrides via environment, for example QUARKUS_ORAS_REGISTRIES_DEFAULT_SECURE=false.
quarkus.oras.registries.default.enabled=true
quarkus.oras.registries.default.max-retries=2

# Tests: quarkus-oras starts a zot registry dev service and points the default registry at it.
%test.quarkus.oras.devservices.base-port=25000
%test.quarkus.log.level=INFO
